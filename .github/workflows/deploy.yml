name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin(s)
        run: pnpm build

      - name: Copy additional files
        run: |
          cp README.md dist/README.md
          touch dist/.nojekyll
          printf -- "> You accessed a link that returned a 404, probably by clicking one of the plugin links. Copy the link address and add it into your Discord mod (Shiggycord, Revenge, Bunny, etc.) instead of opening it in a browser.\n\n" > dist/404.html
          cat README.md >> dist/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          enable_jekyll: false
